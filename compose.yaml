# 로컬 개발용 PostgreSQL. `docker compose up -d`로 띄우고 `npm run db:migrate`로 표를 만든다.
# 배포에서는 쓰지 않는다. 배포 환경에는 DATABASE_URL만 넣으면 된다.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chameleon
      POSTGRES_PASSWORD: chameleon
      POSTGRES_DB: chameleon
    ports:
      - "5432:5432"
    volumes:
      - chameleon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chameleon"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  chameleon-pg:
